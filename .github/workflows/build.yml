name: Build Flutter App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter Project & Inject Code & Assets
        run: |
          # 1. إنشاء هياكل مشروع فلاتر الأندرويد
          flutter create . --org com.adhkar.app --project-name adhkar_app --platforms android
          
          # 2. إنشاء مجلد الأصول للصور
          mkdir -p assets

          # 3. البحث عن صورة اللوجو الشفاف الداخلي logo.png ونقله لمجلد assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/logo.png
          elif [ -f ".github/workflows/logo.png" ]; then
            cp .github/workflows/logo.png assets/logo.png
          fi

          # 4. تثبيت مكتبة flutter_launcher_icons لتوليد أيقونة الهاتف الخارجية بشكل هندسي سليم 100% وتجنب أخطاء AAPT2
          cat << 'EOF' > flutter_icons.yaml
          dev_dependencies:
            flutter_launcher_icons: "^0.13.1"

          flutter_launcher_icons:
            image_path: "ic_launcher.png"
            android: true
            ios: false
            image_path_android: "ic_launcher.png"
          EOF

          # البحث عن أيقونة الهاتف الخارجية ic_launcher.png
          if [ -f "ic_launcher.png" ]; then
            cp ic_launcher.png ic_launcher.png
          elif [ -f ".github/workflows/ic_launcher.png" ]; then
            cp .github/workflows/ic_launcher.png ic_launcher.png
          fi

          # 5. تغيير اسم التطبيق ليظهر بالعربي "أذكار الصباح والمساء" على شاشة الهاتف
          sed -i 's/android:label="adhkar_app"/android:label="أذكار الصباح والمساء"/g' android/app/src/main/AndroidManifest.xml

          # 6. نقل ملف الكود الرئيسي main.dart لمكانه الصحيح
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          elif [ -f ".github/workflows/main.dart" ]; then
            cp .github/workflows/main.dart lib/main.dart
          fi
          
          # 7. إعداد ملف pubspec.yaml لربط الأصول والموارد
          cat << 'EOF' > pubspec.yaml
          name: adhkar_app
          description: "تطبيق أذكار الصباح والمساء"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
            flutter_launcher_icons: ^0.13.1
          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
          EOF

      - name: Install dependencies & Generate Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons:main -f flutter_icons.yaml || true

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
