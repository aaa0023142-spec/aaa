name: Build Flutter App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter Project & Inject Code
        run: |
          # إنشاء مشروع فلاتر حقيقي وجاهز بكافة ملفات الأندرويد والإعدادات
          flutter create . --org com.adhkar.app --project-name adhkar_app --platforms android
          
          # نقل كود الأذكار الخاص بك إلى الملف الرئيسي للمشروع المنشأ حديثاً
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          elif [ -f "إذكار الصباح والمساء.txt" ]; then
            cp "إذكار الصباح والمساء.txt" lib/main.dart
          else
            find . -maxdepth 1 -type f \( -name "*.dart" -o -name "*.txt" \) ! -name "README.md" -exec cp {} lib/main.dart \; -quit
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
